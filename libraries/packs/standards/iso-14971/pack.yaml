frameworks:
- slug: iso-14971-2019
  name: ISO 14971
  version: '2019'
  issuer: International Organization for Standardization
  description: Medical devices - Application of risk management to medical devices
  requirements:
  - section_code: '4.1'
    description: Establish, document, and maintain a risk management process throughout the product lifecycle
  - section_code: '5.1'
    description: Risk analysis including intended use, identification of hazards, and estimation of risks
  - section_code: '6.1'
    description: Risk evaluation by comparing estimated risks against risk acceptability criteria
  - section_code: '7.1'
    description: Risk control measures to reduce risks to acceptable levels
