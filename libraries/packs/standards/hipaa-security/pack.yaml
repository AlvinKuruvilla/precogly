frameworks:
- slug: hipaa-security-2013
  name: HIPAA Security Rule
  version: '2013'
  issuer: U.S. Department of Health and Human Services
  description: Health Insurance Portability and Accountability Act Security Rule technical safeguards
  requirements:
  - section_code: 164.312(a)
    description: 'Access control: implement technical policies and procedures to allow access only to authorized persons'
  - section_code: 164.312(b)
    description: 'Audit controls: implement mechanisms to record and examine access and activity in systems containing ePHI'
  - section_code: 164.312(c)
    description: 'Integrity controls: implement policies and procedures to protect ePHI from improper alteration or destruction'
  - section_code: 164.312(e)
    description: 'Transmission security: implement technical measures to guard against unauthorized access to ePHI during
      transmission'
