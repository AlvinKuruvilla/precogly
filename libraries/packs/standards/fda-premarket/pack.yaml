frameworks:
- slug: fda-premarket-2023
  name: FDA Pre-Market Cybersecurity
  version: '2023'
  issuer: U.S. Food and Drug Administration
  description: 'Cybersecurity in Medical Devices: Quality System Considerations and Content of Premarket Submissions'
  requirements:
  - section_code: FDA-PM-1
    description: Perform threat modeling to identify cybersecurity risks to the device and its ecosystem
  - section_code: FDA-PM-2
    description: Implement authentication and access control mechanisms appropriate for the device use environment
  - section_code: FDA-PM-3
    description: Apply encryption for data at rest and data in transit to protect sensitive health information
  - section_code: FDA-PM-4
    description: Generate and maintain a Software Bill of Materials (SBOM) for all software components
