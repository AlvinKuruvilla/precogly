frameworks:
- slug: nist-csf-health-2024
  name: NIST CSF Healthcare
  version: '2.0'
  issuer: National Institute of Standards and Technology
  description: NIST Cybersecurity Framework 2.0 healthcare sector profile
  requirements:
  - section_code: ID.AM
    description: Identify and manage assets, data, and systems that support critical healthcare functions
  - section_code: PR.AC
    description: Protect by managing access control and authentication for healthcare systems
  - section_code: DE.CM
    description: Detect anomalies and events through continuous monitoring of healthcare IT environment
  - section_code: RS.RP
    description: Respond to detected cybersecurity incidents using established response plans
  - section_code: RC.RP
    description: Recover by executing recovery plans to restore healthcare services after incidents
