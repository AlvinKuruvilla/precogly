threats:
  # ============================================================================
  # S3 Threats
  # ============================================================================
  - id: s3-public-exposure
    name: S3 Bucket Public Exposure
    description: |
      S3 bucket is publicly accessible, exposing sensitive data to unauthorized users.
      This can occur through misconfigured bucket policies, ACLs, or disabled Block Public Access.

  - id: s3-data-tampering
    name: S3 Object Tampering
    description: |
      Unauthorized modification of S3 objects due to misconfigured permissions.
      Attackers may alter data, inject malicious content, or corrupt backups.

  - id: s3-deletion
    name: S3 Data Deletion
    description: |
      Malicious or accidental deletion of S3 objects without proper versioning or MFA delete.
      Can lead to permanent data loss and service disruption.

  # ============================================================================
  # Lambda Threats
  # ============================================================================
  - id: lambda-injection
    name: Lambda Code Injection
    description: |
      Malicious input exploits Lambda function leading to code execution.
      Includes SQL injection, command injection, or template injection attacks.

  - id: lambda-privilege-escalation
    name: Lambda Role Over-Privileged
    description: |
      Lambda execution role has excessive permissions enabling privilege escalation.
      Compromised function could access resources beyond its intended scope.

  - id: lambda-secret-exposure
    name: Lambda Environment Variable Exposure
    description: |
      Sensitive data (API keys, credentials) stored in Lambda environment variables
      may be exposed through logs, error messages, or function enumeration.

  - id: lambda-dos
    name: Lambda Resource Exhaustion
    description: |
      Attacker triggers excessive Lambda invocations causing throttling, high costs,
      or denial of service to legitimate users.

  # ============================================================================
  # API Gateway Threats
  # ============================================================================
  - id: apigw-unauthorized-access
    name: API Gateway Unauthorized Access
    description: |
      API endpoints accessible without proper authentication, allowing unauthorized
      access to backend services and data.

  - id: apigw-injection
    name: API Gateway Input Injection
    description: |
      Malicious payloads passed through API Gateway to backend services,
      exploiting insufficient input validation.

  - id: apigw-rate-limit-bypass
    name: API Gateway Rate Limit Bypass
    description: |
      Attacker bypasses API throttling through distributed requests or
      exploiting misconfigured rate limiting, causing backend overload.

  - id: apigw-logging-gap
    name: API Gateway Insufficient Logging
    description: |
      Lack of comprehensive API logging prevents detection of attacks,
      unauthorized access attempts, and security incident investigation.

  # ============================================================================
  # DynamoDB Threats
  # ============================================================================
  - id: dynamodb-unauthorized-access
    name: DynamoDB Unauthorized Table Access
    description: |
      IAM policies allow broader access to DynamoDB tables than required,
      enabling unauthorized data reads or modifications.

  - id: dynamodb-injection
    name: DynamoDB Query Injection
    description: |
      Malicious input manipulates DynamoDB queries through improperly
      constructed filter expressions or condition expressions.

  - id: dynamodb-capacity-exhaustion
    name: DynamoDB Capacity Exhaustion
    description: |
      Attacker consumes provisioned throughput capacity through excessive
      requests, causing throttling for legitimate users.

  # ============================================================================
  # SQS Threats
  # ============================================================================
  - id: sqs-message-tampering
    name: SQS Message Tampering
    description: |
      Unauthorized modification of messages in transit or at rest,
      potentially altering application behavior or injecting malicious payloads.

  - id: sqs-message-injection
    name: SQS Malicious Message Injection
    description: |
      Attacker injects unauthorized messages into the queue, potentially
      triggering unintended actions in consuming applications.

  - id: sqs-queue-flooding
    name: SQS Queue Flooding
    description: |
      Excessive messages sent to queue causing processing delays, increased
      costs, and potential denial of service to consumers.

  # ============================================================================
  # Data Flow Threats (apply to connections between components)
  # ============================================================================
  - id: dataflow-mitm
    name: Man-in-the-Middle Attack
    description: |
      Attacker intercepts and potentially modifies data in transit between
      components. Can lead to data theft, tampering, or credential capture.

  - id: dataflow-eavesdropping
    name: Data Eavesdropping
    description: |
      Unauthorized interception and reading of data transmitted between
      components, exposing sensitive information to attackers.

  - id: dataflow-replay-attack
    name: Replay Attack
    description: |
      Attacker captures legitimate requests and re-transmits them to perform
      unauthorized actions or duplicate transactions.

  - id: dataflow-injection
    name: Data Injection in Transit
    description: |
      Malicious data injected into the communication channel between components,
      potentially exploiting downstream systems or corrupting data.

  # ============================================================================
  # Bedrock / LLM Threats
  # ============================================================================
  - id: bedrock-prompt-injection
    name: LLM Prompt Injection
    description: |
      Attacker crafts input that manipulates the LLM's behavior by injecting
      instructions into prompts. Includes direct injection (user input) and
      indirect injection (via RAG context, tool outputs, or other data sources).
      Can cause the model to ignore system instructions, exfiltrate data, or
      perform unauthorized actions.

  - id: bedrock-jailbreak
    name: LLM Jailbreak
    description: |
      Attacker bypasses model safety guardrails and content filters through
      adversarial prompting techniques. Enables generation of harmful content,
      policy-violating responses, or disclosure of system prompts.

  - id: bedrock-data-leakage
    name: LLM Data Leakage
    description: |
      Sensitive data (PII, credentials, cardholder data, internal configurations)
      leaked through LLM responses. Can occur via training data memorization,
      RAG context inclusion, or insufficient output filtering.

  - id: bedrock-sensitive-data-in-prompt
    name: Sensitive Data Exposure in Prompts
    description: |
      Cardholder data, PII, or other sensitive information sent to the LLM in
      prompts or RAG context without tokenization or masking. Data may be logged,
      cached, or used for model improvement by the provider.

  - id: bedrock-model-abuse
    name: LLM Resource Abuse
    description: |
      Unauthorized or excessive model invocations causing financial impact through
      high token consumption, denial of service to legitimate users, or abuse of
      model capabilities for malicious purposes (spam, phishing content generation).

  # ============================================================================
  # RAG / OpenSearch Serverless Threats
  # ============================================================================
  - id: rag-poisoning
    name: RAG Knowledge Base Poisoning
    description: |
      Attacker injects malicious or manipulated content into the RAG knowledge base
      (vector store). Poisoned documents influence model outputs, enabling indirect
      prompt injection, misinformation, or targeted manipulation of responses.

  - id: rag-unauthorized-retrieval
    name: RAG Unauthorized Document Retrieval
    description: |
      RAG pipeline retrieves and includes documents in the model context that the
      requesting user is not authorized to access. Occurs when document-level access
      controls are not enforced during semantic search.

  - id: opensearch-data-exfiltration
    name: Vector Store Data Exfiltration
    description: |
      Vector embeddings in OpenSearch Serverless are exploited to reconstruct or
      infer sensitive source data. Attackers with read access to embeddings can
      reverse-engineer original text content or identify sensitive patterns.

  # ============================================================================
  # Cognito Threats
  # ============================================================================
  - id: cognito-token-theft
    name: Cognito Token Theft
    description: |
      Stolen or forged Cognito JWT tokens used for unauthorized access to
      protected resources. Tokens intercepted via XSS, insecure storage, or
      man-in-the-middle attacks on token endpoints.

  - id: cognito-account-takeover
    name: Cognito Account Takeover
    description: |
      Attacker gains control of user accounts through credential stuffing, weak
      password policies, or social engineering. Compromised accounts provide
      legitimate access to AI-powered services and sensitive data.

  # ============================================================================
  # WAF Threats
  # ============================================================================
  - id: waf-bypass
    name: WAF Rule Bypass
    description: |
      Attacker circumvents WAF rules through encoding tricks, payload fragmentation,
      or exploiting gaps in rule coverage. Bypassed WAF allows malicious requests
      to reach backend services including AI endpoints.

  # ============================================================================
  # CloudWatch Threats
  # ============================================================================
  - id: cloudwatch-log-injection
    name: CloudWatch Log Injection
    description: |
      Attacker injects crafted data into application logs stored in CloudWatch,
      creating misleading entries that obscure attacks, trigger false alarms,
      or exploit log analysis tools.
