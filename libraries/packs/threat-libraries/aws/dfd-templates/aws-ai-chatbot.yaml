template:
  slug: aws-ai-chatbot
  name: "AWS AI Chatbot (RAG)"
  description: "AWS AI chatbot with Bedrock, RAG pipeline via OpenSearch Serverless, Cognito auth, and WAF protection"
  category: ai
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-customer"
      type: "humanActor"
      position: { x: 60, y: 330 }
      data:
        label: "Customer"
        actorType: "user"
        description: "End user interacting with the AI chatbot"

    - id: "actor-bedrock"
      type: "systemActor"
      position: { x: 1170, y: 120 }
      data:
        label: "Amazon Bedrock"
        systemType: "service"
        component_ref: "bedrock"
        description: "Foundation model service (e.g. Claude)"

    - id: "actor-payment-api"
      type: "systemActor"
      position: { x: 1170, y: 540 }
      data:
        label: "Payment API"
        systemType: "service"
        description: "External payment processing backend"

    # ---- System Scope ----
    - id: "scope-aws"
      type: "systemScope"
      position: { x: 270, y: 30 }
      style: { width: 890, height: 710 }
      data:
        label: "AWS Cloud"

    # ---- Trust Zones ----
    - id: "tz-public"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 45 }
      style: { width: 270, height: 300 }
      data:
        label: "Public Edge"
        zoneType: "zoneInternet"

    - id: "tz-app"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 330, y: 45 }
      style: { width: 510, height: 300 }
      data:
        label: "Application VPC"
        zoneType: "zoneInternal"

    - id: "tz-data"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 330, y: 375 }
      style: { width: 530, height: 300 }
      data:
        label: "Data Tier"
        zoneType: "zoneRestricted"

    # ---- Processes ----
    - id: "process-waf"
      type: "process"
      parentId: "tz-public"
      position: { x: 60, y: 30 }
      style: { width: 150, height: 70 }
      data:
        label: "AWS WAF"
        component_ref: "waf"
        technology: "AWS WAF"
        description: "Web application firewall filtering requests"

    - id: "process-apigw"
      type: "process"
      parentId: "tz-public"
      position: { x: 60, y: 165 }
      style: { width: 150, height: 70 }
      data:
        label: "API Gateway"
        component_ref: "api-gateway"
        technology: "Amazon API Gateway"
        description: "REST API with Cognito authorizer"

    - id: "process-lambda-orchestrator"
      type: "process"
      parentId: "tz-app"
      position: { x: 60, y: 30 }
      style: { width: 150, height: 70 }
      data:
        label: "Lambda Orchestrator"
        component_ref: "lambda"
        technology: "AWS Lambda"
        description: "Chatbot orchestration logic"
        dataSensitivity: "confidential"

    - id: "process-lambda-rag"
      type: "process"
      parentId: "tz-app"
      position: { x: 285, y: 30 }
      style: { width: 150, height: 70 }
      data:
        label: "Lambda RAG Pipeline"
        component_ref: "lambda"
        technology: "AWS Lambda"
        description: "Retrieval-augmented generation pipeline"
        dataSensitivity: "confidential"

    # ---- Data Stores ----
    - id: "datastore-opensearch"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 40, y: 55 }
      style: { width: 170, height: 90 }
      data:
        label: "Vector Store"
        component_ref: "opensearch-serverless"
        technology: "Amazon OpenSearch Serverless"
        description: "Vector embeddings for RAG knowledge base"
        dataSensitivity: "confidential"

    - id: "datastore-dynamodb"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 310, y: 55 }
      style: { width: 170, height: 90 }
      data:
        label: "Session Store"
        component_ref: "dynamodb"
        technology: "Amazon DynamoDB"
        description: "Chat session history and metadata"
        dataSensitivity: "confidential"

    - id: "datastore-s3"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 170, y: 170 }
      style: { width: 170, height: 90 }
      data:
        label: "Document Bucket"
        component_ref: "s3"
        technology: "Amazon S3"
        description: "Source documents for RAG ingestion"
        dataSensitivity: "confidential"

  edges:
    # Customer → WAF → API Gateway
    - id: "edge-customer-to-waf"
      source: "actor-customer"
      target: "process-waf"
      type: "dataFlow"
      data:
        label: "Chat request"
        encrypted: true
        authenticated: false

    - id: "edge-waf-to-apigw"
      source: "process-waf"
      target: "process-apigw"
      type: "dataFlow"
      data:
        label: "Filtered request"
        encrypted: true
        authenticated: false

    - id: "edge-apigw-to-customer"
      source: "process-apigw"
      target: "actor-customer"
      type: "dataFlow"
      data:
        label: "Chatbot response"
        encrypted: true
        authenticated: true

    # API Gateway → Lambda Orchestrator
    - id: "edge-apigw-to-lambda"
      source: "process-apigw"
      target: "process-lambda-orchestrator"
      type: "dataFlow"
      data:
        label: "Authorized request"
        encrypted: true
        authenticated: true

    - id: "edge-lambda-to-apigw"
      source: "process-lambda-orchestrator"
      target: "process-apigw"
      type: "dataFlow"
      data:
        label: "Generated response"
        encrypted: true
        authenticated: true

    # Lambda Orchestrator → Bedrock
    - id: "edge-lambda-to-bedrock"
      source: "process-lambda-orchestrator"
      target: "actor-bedrock"
      type: "dataFlow"
      data:
        label: "Prompt + RAG context"
        encrypted: true
        authenticated: true

    - id: "edge-bedrock-to-lambda"
      source: "actor-bedrock"
      target: "process-lambda-orchestrator"
      type: "dataFlow"
      data:
        label: "Model completion"
        encrypted: true
        authenticated: true

    # Lambda Orchestrator → Lambda RAG Pipeline
    - id: "edge-orchestrator-to-rag"
      source: "process-lambda-orchestrator"
      target: "process-lambda-rag"
      type: "dataFlow"
      data:
        label: "Embedding query"
        encrypted: true
        authenticated: true

    - id: "edge-rag-to-orchestrator"
      source: "process-lambda-rag"
      target: "process-lambda-orchestrator"
      type: "dataFlow"
      data:
        label: "Retrieved context"
        encrypted: true
        authenticated: true

    # Lambda RAG → OpenSearch
    - id: "edge-rag-to-opensearch"
      source: "process-lambda-rag"
      target: "datastore-opensearch"
      type: "dataFlow"
      data:
        label: "Vector similarity search"
        encrypted: true
        authenticated: true

    - id: "edge-opensearch-to-rag"
      source: "datastore-opensearch"
      target: "process-lambda-rag"
      type: "dataFlow"
      data:
        label: "Matching documents"
        encrypted: true
        authenticated: true

    # Lambda Orchestrator → DynamoDB
    - id: "edge-lambda-to-dynamodb"
      source: "process-lambda-orchestrator"
      target: "datastore-dynamodb"
      type: "dataFlow"
      data:
        label: "Session read/write"
        encrypted: true
        authenticated: true

    # Lambda Orchestrator → Payment API
    - id: "edge-lambda-to-payment"
      source: "process-lambda-orchestrator"
      target: "actor-payment-api"
      type: "dataFlow"
      data:
        label: "Tokenized card lookup"
        encrypted: true
        authenticated: true

    - id: "edge-payment-to-lambda"
      source: "actor-payment-api"
      target: "process-lambda-orchestrator"
      type: "dataFlow"
      data:
        label: "Payment status"
        encrypted: true
        authenticated: true

    # S3 → OpenSearch (document ingestion)
    - id: "edge-s3-to-opensearch"
      source: "datastore-s3"
      target: "datastore-opensearch"
      type: "dataFlow"
      data:
        label: "Document ingestion"
        encrypted: true
        authenticated: true
