mappings:
  # S3 Threat → Countermeasure mappings
  - threat: s3-public-exposure
    countermeasures:
      - s3-block-public-access
      - s3-bucket-policy
      - s3-access-logging

  - threat: s3-data-tampering
    countermeasures:
      - s3-versioning
      - s3-encryption
      - s3-bucket-policy

  - threat: s3-deletion
    countermeasures:
      - s3-versioning
      - s3-mfa-delete
      - s3-bucket-policy

  # Lambda Threat → Countermeasure mappings
  - threat: lambda-injection
    countermeasures:
      - lambda-input-validation
      - lambda-vpc
      - lambda-code-signing

  - threat: lambda-privilege-escalation
    countermeasures:
      - lambda-least-privilege

  - threat: lambda-secret-exposure
    countermeasures:
      - lambda-secrets-manager
      - lambda-vpc

  - threat: lambda-dos
    countermeasures:
      - lambda-reserved-concurrency
      - apigw-throttling

  # API Gateway Threat → Countermeasure mappings
  - threat: apigw-unauthorized-access
    countermeasures:
      - apigw-cognito-auth
      - apigw-api-key
      - apigw-waf

  - threat: apigw-injection
    countermeasures:
      - apigw-waf
      - apigw-request-validation
      - lambda-input-validation

  - threat: apigw-rate-limit-bypass
    countermeasures:
      - apigw-throttling
      - apigw-waf
      - apigw-api-key

  - threat: apigw-logging-gap
    countermeasures:
      - apigw-cloudwatch-logging

  # DynamoDB Threat → Countermeasure mappings
  - threat: dynamodb-unauthorized-access
    countermeasures:
      - dynamodb-fine-grained-access
      - dynamodb-encryption
      - dynamodb-vpc-endpoint

  - threat: dynamodb-injection
    countermeasures:
      - lambda-input-validation
      - dynamodb-fine-grained-access

  - threat: dynamodb-capacity-exhaustion
    countermeasures:
      - apigw-throttling
      - dynamodb-pitr

  # SQS Threat → Countermeasure mappings
  - threat: sqs-message-tampering
    countermeasures:
      - sqs-encryption
      - sqs-queue-policy

  - threat: sqs-message-injection
    countermeasures:
      - sqs-queue-policy
      - sqs-message-validation
      - sqs-dlq

  - threat: sqs-queue-flooding
    countermeasures:
      - sqs-queue-policy
      - sqs-dlq
      - apigw-throttling

  # Data Flow Threat → Countermeasure mappings
  - threat: dataflow-mitm
    countermeasures:
      - tls-encryption
      - mutual-tls
      - vpc-private-link

  - threat: dataflow-eavesdropping
    countermeasures:
      - tls-encryption
      - vpc-private-link
      - api-gateway-private

  - threat: dataflow-replay-attack
    countermeasures:
      - request-signing
      - mutual-tls

  - threat: dataflow-injection
    countermeasures:
      - tls-encryption
      - request-signing
      - lambda-input-validation

  # Bedrock / LLM Threat → Countermeasure mappings
  - threat: bedrock-prompt-injection
    countermeasures:
      - bedrock-guardrails
      - bedrock-input-validation
      - bedrock-output-filtering
      - apigw-waf

  - threat: bedrock-jailbreak
    countermeasures:
      - bedrock-guardrails
      - bedrock-input-validation
      - bedrock-model-invocation-logging

  - threat: bedrock-data-leakage
    countermeasures:
      - bedrock-guardrails
      - bedrock-output-filtering
      - bedrock-data-masking
      - bedrock-model-invocation-logging

  - threat: bedrock-sensitive-data-in-prompt
    countermeasures:
      - bedrock-data-masking
      - bedrock-guardrails
      - bedrock-vpc-endpoint

  - threat: bedrock-model-abuse
    countermeasures:
      - bedrock-token-budget
      - apigw-throttling
      - bedrock-model-invocation-logging
      - apigw-cognito-auth

  # RAG / OpenSearch Threat → Countermeasure mappings
  - threat: rag-poisoning
    countermeasures:
      - rag-data-sanitization
      - opensearch-access-policy
      - bedrock-output-filtering

  - threat: rag-unauthorized-retrieval
    countermeasures:
      - rag-access-control
      - opensearch-access-policy
      - bedrock-output-filtering

  - threat: opensearch-data-exfiltration
    countermeasures:
      - opensearch-encryption
      - opensearch-access-policy
      - bedrock-vpc-endpoint

  # Cognito Threat → Countermeasure mappings
  - threat: cognito-token-theft
    countermeasures:
      - cognito-mfa
      - tls-encryption
      - cognito-advanced-security

  - threat: cognito-account-takeover
    countermeasures:
      - cognito-mfa
      - cognito-advanced-security
      - cloudwatch-alarm

  # WAF Threat → Countermeasure mappings
  - threat: waf-bypass
    countermeasures:
      - waf-managed-rules
      - apigw-request-validation
      - lambda-input-validation

  # CloudWatch Threat → Countermeasure mappings
  - threat: cloudwatch-log-injection
    countermeasures:
      - lambda-input-validation
      - cloudwatch-alarm
