threats:
  # ============================================================================
  # PLC Threats
  # ============================================================================
  - id: plc-firmware-manipulation
    name: PLC Firmware Manipulation
    description: |
      Adversary modifies PLC firmware to embed persistent malicious functionality
      that survives power cycles and program downloads. Similar to attacks seen
      in Stuxnet and TRITON/TRISIS incidents. Can alter process behavior while
      reporting normal values to the SCADA system.

  - id: plc-logic-tampering
    name: PLC Logic Tampering
    description: |
      Unauthorized modification of PLC control logic (ladder diagrams, function
      blocks, or structured text) to alter process behavior. May change setpoints,
      disable interlocks, or introduce time-delayed malicious actions that are
      difficult to detect during routine inspections.

  - id: plc-unauthorized-access
    name: PLC Unauthorized Access
    description: |
      Unauthorized access to PLC programming interfaces via default credentials,
      protocol exploitation, or network-level access. Many PLCs lack authentication
      on their programming ports, allowing anyone with network access to read or
      modify the control program.

  # ============================================================================
  # RTU Threats
  # ============================================================================
  - id: rtu-protocol-exploit
    name: RTU Protocol Exploitation
    description: |
      Exploitation of legacy industrial protocols (Modbus RTU/TCP, DNP3, IEC 60870-5)
      that lack built-in authentication or encryption. Allows attackers to send
      unauthorized commands, read process data, or disrupt communications.

  - id: rtu-spoofed-commands
    name: RTU Spoofed Control Commands
    description: |
      Injection of forged control commands to RTUs using industrial protocols
      that lack message authentication. Can cause unintended valve operations,
      pump starts/stops, or breaker operations at remote sites.

  # ============================================================================
  # SCADA Threats
  # ============================================================================
  - id: scada-unauthorized-access
    name: SCADA Unauthorized Access
    description: |
      Unauthorized access to the SCADA application through credential theft,
      default passwords, or exploitation of web-based SCADA interfaces.
      Provides supervisory control over the entire monitored process.

  - id: scada-command-injection
    name: SCADA Command Injection
    description: |
      Injection of unauthorized supervisory commands through the SCADA system
      to downstream controllers. Can override operator setpoints, disable
      alarms, or force equipment into unsafe operating states.

  - id: scada-data-manipulation
    name: SCADA Display Data Manipulation
    description: |
      Manipulation of process data displayed on SCADA screens to present
      operators with false information. Masks the true state of the physical
      process while malicious actions are being carried out.

  # ============================================================================
  # HMI Threats
  # ============================================================================
  - id: hmi-unauthorized-access
    name: HMI Unauthorized Access
    description: |
      Unauthorized access to operator HMI stations, often running on Windows-based
      systems with outdated patches. Compromised HMIs allow direct issuance of
      control commands and manipulation of alarm configurations.

  - id: hmi-display-manipulation
    name: HMI Display Manipulation
    description: |
      Manipulation of HMI graphics and process displays to present operators
      with a false view of the process state. Operators make incorrect decisions
      based on fabricated data, potentially worsening an ongoing incident.

  # ============================================================================
  # Historian Threats
  # ============================================================================
  - id: historian-data-tampering
    name: Historian Data Tampering
    description: |
      Modification or deletion of historical process data stored in the historian
      to cover tracks, compromise regulatory reporting, or undermine incident
      investigation. Process historians often contain months of operational data
      critical for compliance and forensics.

  - id: historian-data-exfiltration
    name: Historian Data Exfiltration
    description: |
      Exfiltration of process data and operational intelligence from the historian
      server. Production rates, chemical compositions, process recipes, and
      equipment configurations represent valuable intellectual property and
      can reveal operational vulnerabilities.

  # ============================================================================
  # DCS Threats
  # ============================================================================
  - id: dcs-config-manipulation
    name: DCS Configuration Manipulation
    description: |
      Unauthorized modification of DCS controller configuration including
      control strategies, alarm limits, and interlock settings. Changes to
      DCS configuration can cascade across multiple process units and affect
      plant-wide operations.

  - id: dcs-controller-disruption
    name: DCS Controller Disruption
    description: |
      Disruption of DCS controller operation through denial of service, memory
      exhaustion, or forced mode changes. Loss of a DCS controller can halt
      production for entire process units and may trigger emergency shutdowns.

  # ============================================================================
  # Engineering Workstation Threats
  # ============================================================================
  - id: ews-compromise
    name: Engineering Workstation Compromise
    description: |
      Compromise of the engineering workstation through phishing, malware,
      or exploitation of unpatched software. Engineering workstations serve as
      high-value pivot points because they have programming access to controllers
      and typically span IT/OT network boundaries.

  - id: ews-rogue-project
    name: Rogue Engineering Project Upload
    description: |
      Upload of a malicious or trojanized engineering project file to controllers.
      Modified project files may contain hidden logic that activates under
      specific conditions, similar to supply chain attacks targeting engineering
      software.

  # ============================================================================
  # Safety Instrumented System Threats
  # ============================================================================
  - id: sis-bypass
    name: Safety System Bypass
    description: |
      Deliberate bypass or disabling of safety instrumented functions by
      compromising the SIS controller or forcing overrides. A disabled SIS
      cannot protect against hazardous conditions, potentially leading to
      explosions, toxic releases, or equipment destruction. The TRITON malware
      specifically targeted SIS controllers.

  - id: sis-false-trip
    name: Safety System False Trip
    description: |
      Triggering of false safety shutdowns by injecting spoofed sensor readings
      or manipulating SIS inputs. Causes unplanned production outages, potential
      process upsets from rapid shutdown sequences, and erosion of operator trust
      in safety systems.

  # ============================================================================
  # Industrial Firewall Threats
  # ============================================================================
  - id: firewall-bypass
    name: Industrial Firewall Bypass
    description: |
      Bypass of the industrial DMZ or firewall through exploitation of allowed
      services, tunneling through permitted protocols, or leveraging dual-homed
      systems that bridge network zones. Collapses the security boundary between
      IT and OT networks.

  - id: firewall-misconfiguration
    name: Firewall Rule Misconfiguration
    description: |
      Exploitation of overly permissive firewall rules that allow unnecessary
      traffic between network zones. Common issues include broad port ranges,
      any-to-any rules added during commissioning, and rules that were never
      removed after temporary access was no longer needed.

  # ============================================================================
  # OPC UA Gateway Threats
  # ============================================================================
  - id: opcua-auth-bypass
    name: OPC UA Authentication Bypass
    description: |
      Bypass of OPC UA server authentication through exploitation of anonymous
      access, weak certificate validation, or default security policies. Grants
      unauthorized read/write access to process data and control parameters
      exposed through the OPC UA information model.

  - id: opcua-data-interception
    name: OPC UA Data Interception
    description: |
      Interception of OPC UA communications when security mode is set to None
      or SignOnly instead of SignAndEncrypt. Exposes process values, setpoints,
      and potentially control commands to network-level attackers.

  # ============================================================================
  # Field Device Threats
  # ============================================================================
  - id: sensor-spoofing
    name: Sensor Reading Spoofing
    description: |
      Spoofing of sensor readings by injecting false signals on analog loops
      (4-20mA), manipulating digital fieldbus values, or compromising smart
      transmitters via HART commands. Controllers make incorrect process
      decisions based on fabricated measurements.

  - id: sensor-physical-tampering
    name: Field Instrument Physical Tampering
    description: |
      Physical tampering with field instruments including disconnecting sensors,
      manipulating calibration, damaging equipment, or installing unauthorized
      devices on instrument loops. Requires physical access to the field but
      can cause significant process disruption.

  # ============================================================================
  # Data Flow Threats (OT-specific)
  # ============================================================================
  - id: ot-protocol-mitm
    name: Industrial Protocol Man-in-the-Middle
    description: |
      Man-in-the-middle attack on industrial protocol communications (Modbus TCP,
      EtherNet/IP, PROFINET, DNP3) to intercept and modify control data in transit.
      Most industrial protocols lack encryption, making MITM attacks feasible for
      anyone with network access.

  - id: ot-unencrypted-traffic
    name: Unencrypted Industrial Protocol Traffic
    description: |
      Exploitation of unencrypted industrial protocol traffic to passively
      capture process data, credentials, and control commands. Legacy protocols
      such as Modbus, DNP3, and BACnet transmit all data in cleartext.

  - id: ot-command-replay
    name: Industrial Command Replay
    description: |
      Capture and replay of legitimate industrial protocol commands to reproduce
      authorized actions at unauthorized times. Replayed commands can open valves,
      start pumps, or change setpoints without proper authorization.

  - id: it-ot-lateral-movement
    name: IT-to-OT Lateral Movement
    description: |
      Lateral movement from the corporate IT network into the OT control system
      network through shared services, dual-homed systems, improperly segmented
      networks, or compromised jump hosts. Once inside the OT network, attackers
      can reach controllers and safety systems.
