template:
  slug: hydrogen-production-monitoring
  name: "Hydrogen Production Monitoring System"
  description: "Data flow diagram for a green hydrogen electrolysis plant monitoring system with PLC-based control, OPC UA data integration, and cloud analytics"
  category: industrialControl
  diagram_type: level1

canvas_data:
  nodes:
    # Human Actors
    - id: "actor-plant-operator"
      type: "humanActor"
      position: { x: 90, y: 280 }
      data:
        label: "Plant Operator"
        actorType: "user"
        component_ref: "control-operator"
        description: "Hydrogen plant control room operator"

    # System Scope
    - id: "scope-h2-plant"
      type: "systemScope"
      position: { x: 300, y: 30 }
      style: { width: 1000, height: 750 }
      data:
        label: "Hydrogen Production Plant"

    # Trust Zones
    - id: "zone-plant-network"
      type: "trustZone"
      parentId: "scope-h2-plant"
      position: { x: 30, y: 50 }
      style: { width: 450, height: 340 }
      data:
        label: "Plant Control Network"
        zoneType: "zoneRestricted"

    - id: "zone-integration"
      type: "trustZone"
      parentId: "scope-h2-plant"
      position: { x: 30, y: 420 }
      style: { width: 450, height: 240 }
      data:
        label: "Data Integration Zone (DMZ)"
        zoneType: "zoneDMZ"

    - id: "zone-field"
      type: "trustZone"
      parentId: "scope-h2-plant"
      position: { x: 530, y: 50 }
      style: { width: 430, height: 340 }
      data:
        label: "Electrolysis Field Network"
        zoneType: "zoneRestricted"

    # Plant Control Network Components
    - id: "process-hmi-h2"
      type: "process"
      parentId: "zone-plant-network"
      position: { x: 60, y: 45 }
      data:
        label: "Operator HMI"
        component_ref: "hmi"
        technology: "Human-Machine Interface (HMI)"

    - id: "process-scada-h2"
      type: "process"
      parentId: "zone-plant-network"
      position: { x: 240, y: 45 }
      data:
        label: "SCADA Server"
        component_ref: "scada-server"
        technology: "SCADA Server"
        dataSensitivity: "confidential"

    - id: "datastore-historian-h2"
      type: "datastore"
      parentId: "zone-plant-network"
      position: { x: 60, y: 195 }
      data:
        label: "Plant Historian"
        component_ref: "historian"
        technology: "Process Data Historian"
        dataSensitivity: "confidential"

    # Integration Zone Components
    - id: "process-opc-gw"
      type: "process"
      parentId: "zone-integration"
      position: { x: 60, y: 45 }
      data:
        label: "OPC UA Gateway"
        component_ref: "opc-ua-gateway"
        technology: "OPC UA Gateway"

    - id: "process-dmz-firewall"
      type: "process"
      parentId: "zone-integration"
      position: { x: 240, y: 45 }
      data:
        label: "Industrial Firewall"
        component_ref: "industrial-firewall"
        technology: "Industrial Firewall / DMZ"

    # Field Network Components
    - id: "process-electrolyzer-plc"
      type: "process"
      parentId: "zone-field"
      position: { x: 60, y: 45 }
      data:
        label: "Electrolyzer PLC"
        component_ref: "plc"
        technology: "Programmable Logic Controller (PLC)"
        dataSensitivity: "confidential"

    - id: "process-h2-sis"
      type: "process"
      parentId: "zone-field"
      position: { x: 260, y: 45 }
      data:
        label: "H2 Safety System"
        component_ref: "sis"
        technology: "Safety Instrumented System (SIS)"
        dataSensitivity: "confidential"

    - id: "actor-h2-sensors"
      type: "systemActor"
      parentId: "zone-field"
      position: { x: 60, y: 210 }
      data:
        label: "H2 Sensors"
        component_ref: "field-sensor"
        description: "Hydrogen concentration, temperature, pressure, and flow sensors"

    - id: "actor-h2-actuators"
      type: "systemActor"
      parentId: "zone-field"
      position: { x: 260, y: 210 }
      data:
        label: "Electrolysis Stack Controls"
        component_ref: "actuator"
        description: "Power supply controllers, water valves, gas separation valves"

  edges:
    # Operator -> HMI
    - id: "edge-op-hmi"
      source: "actor-plant-operator"
      target: "process-hmi-h2"
      type: "dataFlow"
      data:
        label: "Operator commands"
        encrypted: false
        authenticated: true

    # HMI -> SCADA
    - id: "edge-hmi-scada-h2"
      source: "process-hmi-h2"
      target: "process-scada-h2"
      type: "dataFlow"
      data:
        label: "Setpoint changes"
        encrypted: false
        authenticated: true

    # SCADA -> HMI
    - id: "edge-scada-hmi-h2"
      source: "process-scada-h2"
      target: "process-hmi-h2"
      type: "dataFlow"
      data:
        label: "Process displays"
        encrypted: false
        authenticated: false

    # SCADA -> Historian
    - id: "edge-scada-hist-h2"
      source: "process-scada-h2"
      target: "datastore-historian-h2"
      type: "dataFlow"
      data:
        label: "Process data archival"
        encrypted: false
        authenticated: false

    # SCADA -> Electrolyzer PLC
    - id: "edge-scada-plc-h2"
      source: "process-scada-h2"
      target: "process-electrolyzer-plc"
      type: "dataFlow"
      data:
        label: "Production targets"
        encrypted: false
        authenticated: false
        protocol: "Modbus TCP"

    # PLC -> SCADA
    - id: "edge-plc-scada-h2"
      source: "process-electrolyzer-plc"
      target: "process-scada-h2"
      type: "dataFlow"
      data:
        label: "Electrolyzer status"
        encrypted: false
        authenticated: false
        protocol: "Modbus TCP"

    # Sensors -> PLC
    - id: "edge-sensors-plc-h2"
      source: "actor-h2-sensors"
      target: "process-electrolyzer-plc"
      type: "dataFlow"
      data:
        label: "H2 measurements"
        encrypted: false
        authenticated: false

    # Sensors -> SIS
    - id: "edge-sensors-sis-h2"
      source: "actor-h2-sensors"
      target: "process-h2-sis"
      type: "dataFlow"
      data:
        label: "H2 concentration alarms"
        encrypted: false
        authenticated: false

    # PLC -> Actuators
    - id: "edge-plc-actuators-h2"
      source: "process-electrolyzer-plc"
      target: "actor-h2-actuators"
      type: "dataFlow"
      data:
        label: "Stack control signals"
        encrypted: false
        authenticated: false

    # SIS -> Actuators
    - id: "edge-sis-actuators-h2"
      source: "process-h2-sis"
      target: "actor-h2-actuators"
      type: "dataFlow"
      data:
        label: "Emergency isolation"
        encrypted: false
        authenticated: false

    # Historian -> OPC UA Gateway
    - id: "edge-hist-opc"
      source: "datastore-historian-h2"
      target: "process-opc-gw"
      type: "dataFlow"
      data:
        label: "Historical data export"
        encrypted: true
        authenticated: true
        protocol: "OPC UA"

    # OPC UA Gateway -> Firewall
    - id: "edge-opc-firewall"
      source: "process-opc-gw"
      target: "process-dmz-firewall"
      type: "dataFlow"
      data:
        label: "Filtered plant data"
        encrypted: true
        authenticated: true
