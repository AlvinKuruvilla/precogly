template:
  slug: lng-process-control
  name: "LNG Facility Process Control"
  description: "Data flow diagram for an LNG facility process control system with SCADA, DCS, safety systems, and historian across IT/OT network zones following the Purdue Model"
  category: industrialControl
  diagram_type: level1

canvas_data:
  nodes:
    # Human Actors
    - id: "actor-operator"
      type: "humanActor"
      position: { x: 90, y: 350 }
      data:
        label: "Control Room Operator"
        actorType: "user"
        component_ref: "control-operator"
        description: "LNG plant control room operator"

    - id: "actor-remote-eng"
      type: "humanActor"
      position: { x: 90, y: 620 }
      data:
        label: "Remote Engineer"
        actorType: "user"
        component_ref: "remote-engineer"
        description: "Remote maintenance and support engineer"

    # System Scope
    - id: "scope-lng-facility"
      type: "systemScope"
      position: { x: 300, y: 30 }
      style: { width: 1100, height: 900 }
      data:
        label: "LNG Facility Control System"

    # Trust Zones
    - id: "zone-enterprise"
      type: "trustZone"
      parentId: "scope-lng-facility"
      position: { x: 30, y: 580 }
      style: { width: 500, height: 185 }
      data:
        label: "Enterprise Network (Level 4-5)"
        zoneType: "zoneInternet"

    - id: "zone-dmz"
      type: "trustZone"
      parentId: "scope-lng-facility"
      position: { x: 30, y: 370 }
      style: { width: 500, height: 180 }
      data:
        label: "Industrial DMZ (Level 3.5)"
        zoneType: "zoneDMZ"

    - id: "zone-operations"
      type: "trustZone"
      parentId: "scope-lng-facility"
      position: { x: 30, y: 160 }
      style: { width: 500, height: 180 }
      data:
        label: "Operations Network (Level 2-3)"
        zoneType: "zoneInternal"

    - id: "zone-control"
      type: "trustZone"
      parentId: "scope-lng-facility"
      position: { x: 560, y: 30 }
      style: { width: 510, height: 530 }
      data:
        label: "Control Network (Level 0-1)"
        zoneType: "zoneRestricted"

    # Enterprise Zone Components
    - id: "process-eng-workstation"
      type: "process"
      parentId: "zone-enterprise"
      position: { x: 60, y: 45 }
      data:
        label: "Engineering Workstation"
        component_ref: "engineering-workstation"
        technology: "Engineering Workstation"

    # DMZ Components
    - id: "process-firewall"
      type: "process"
      parentId: "zone-dmz"
      position: { x: 60, y: 45 }
      data:
        label: "Industrial Firewall"
        component_ref: "industrial-firewall"
        technology: "Industrial Firewall / DMZ"

    - id: "datastore-historian"
      type: "datastore"
      parentId: "zone-dmz"
      position: { x: 280, y: 45 }
      data:
        label: "Process Historian"
        component_ref: "historian"
        technology: "Process Data Historian"
        dataSensitivity: "confidential"

    # Operations Zone Components
    - id: "process-scada"
      type: "process"
      parentId: "zone-operations"
      position: { x: 60, y: 45 }
      data:
        label: "SCADA Server"
        component_ref: "scada-server"
        technology: "SCADA Server"
        dataSensitivity: "confidential"

    - id: "process-hmi"
      type: "process"
      parentId: "zone-operations"
      position: { x: 280, y: 45 }
      data:
        label: "Operator HMI"
        component_ref: "hmi"
        technology: "Human-Machine Interface (HMI)"

    # Control Zone Components
    - id: "process-dcs"
      type: "process"
      parentId: "zone-control"
      position: { x: 60, y: 45 }
      data:
        label: "DCS Controller"
        component_ref: "dcs-controller"
        technology: "DCS Controller"
        dataSensitivity: "confidential"

    - id: "process-sis"
      type: "process"
      parentId: "zone-control"
      position: { x: 280, y: 45 }
      data:
        label: "Safety System (SIS)"
        component_ref: "sis"
        technology: "Safety Instrumented System (SIS)"
        dataSensitivity: "confidential"

    - id: "process-plc"
      type: "process"
      parentId: "zone-control"
      position: { x: 60, y: 210 }
      data:
        label: "Compressor PLC"
        component_ref: "plc"
        technology: "Programmable Logic Controller (PLC)"
        dataSensitivity: "confidential"

    # Field Devices
    - id: "actor-sensors"
      type: "systemActor"
      parentId: "zone-control"
      position: { x: 280, y: 210 }
      data:
        label: "Field Sensors"
        component_ref: "field-sensor"
        description: "Temperature, pressure, flow, and level transmitters"

    - id: "actor-actuators"
      type: "systemActor"
      parentId: "zone-control"
      position: { x: 280, y: 370 }
      data:
        label: "Control Valves"
        component_ref: "actuator"
        description: "LNG process control valves and motor drives"

  edges:
    # Operator -> HMI
    - id: "edge-operator-hmi"
      source: "actor-operator"
      target: "process-hmi"
      type: "dataFlow"
      data:
        label: "Operator commands"
        encrypted: false
        authenticated: true

    # Remote Engineer -> Firewall
    - id: "edge-eng-firewall"
      source: "actor-remote-eng"
      target: "process-firewall"
      type: "dataFlow"
      data:
        label: "Remote access"
        encrypted: true
        authenticated: true
        protocol: "VPN"

    # Firewall -> Engineering Workstation
    - id: "edge-firewall-ews"
      source: "process-firewall"
      target: "process-eng-workstation"
      type: "dataFlow"
      data:
        label: ""
        encrypted: true
        authenticated: true

    # Engineering Workstation -> Firewall
    - id: "edge-ews-firewall"
      source: "process-eng-workstation"
      target: "process-firewall"
      type: "dataFlow"
      data:
        label: "Engineering access"
        encrypted: true
        authenticated: true

    # SCADA -> HMI
    - id: "edge-scada-hmi"
      source: "process-scada"
      target: "process-hmi"
      type: "dataFlow"
      data:
        label: "Process display data"
        encrypted: false
        authenticated: false

    # HMI -> SCADA
    - id: "edge-hmi-scada"
      source: "process-hmi"
      target: "process-scada"
      type: "dataFlow"
      data:
        label: "Operator setpoints"
        encrypted: false
        authenticated: true

    # SCADA -> Historian
    - id: "edge-scada-historian"
      source: "process-scada"
      target: "datastore-historian"
      type: "dataFlow"
      data:
        label: "Process data archival"
        encrypted: false
        authenticated: false

    # SCADA -> DCS
    - id: "edge-scada-dcs"
      source: "process-scada"
      target: "process-dcs"
      type: "dataFlow"
      data:
        label: "Supervisory commands"
        encrypted: false
        authenticated: false
        protocol: "Modbus TCP"

    # DCS -> SCADA
    - id: "edge-dcs-scada"
      source: "process-dcs"
      target: "process-scada"
      type: "dataFlow"
      data:
        label: "Process status"
        encrypted: false
        authenticated: false
        protocol: "Modbus TCP"

    # DCS -> PLC
    - id: "edge-dcs-plc"
      source: "process-dcs"
      target: "process-plc"
      type: "dataFlow"
      data:
        label: "Control parameters"
        encrypted: false
        authenticated: false

    # PLC -> DCS
    - id: "edge-plc-dcs"
      source: "process-plc"
      target: "process-dcs"
      type: "dataFlow"
      data:
        label: "Compressor status"
        encrypted: false
        authenticated: false

    # PLC -> Actuators
    - id: "edge-plc-actuators"
      source: "process-plc"
      target: "actor-actuators"
      type: "dataFlow"
      data:
        label: "Control signals (4-20mA)"
        encrypted: false
        authenticated: false

    # Sensors -> PLC
    - id: "edge-sensors-plc"
      source: "actor-sensors"
      target: "process-plc"
      type: "dataFlow"
      data:
        label: "Process measurements"
        encrypted: false
        authenticated: false

    # Sensors -> SIS
    - id: "edge-sensors-sis"
      source: "actor-sensors"
      target: "process-sis"
      type: "dataFlow"
      data:
        label: "Safety-critical measurements"
        encrypted: false
        authenticated: false

    # SIS -> Actuators
    - id: "edge-sis-actuators"
      source: "process-sis"
      target: "actor-actuators"
      type: "dataFlow"
      data:
        label: "Emergency shutdown signals"
        encrypted: false
        authenticated: false

    # Firewall -> SCADA
    - id: "edge-firewall-scada"
      source: "process-firewall"
      target: "process-scada"
      type: "dataFlow"
      data:
        label: "Filtered traffic"
        encrypted: false
        authenticated: false
